# Netlify configuration for the Vite React web app in this npm-workspaces monorepo.
[build]
  base = "."
  command = "npm run build:web"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/app"
  to = "/app/"
  status = 301
  force = true

[[redirects]]
  from = "/app/*"
  to = "/app/index.html"
  status = 200
  force = false

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
