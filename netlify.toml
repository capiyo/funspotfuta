[build]
  base = "."
  command = "npm run build:web"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "https://funspot.co.ke/*"
  to = "https://www.funspot.co.ke/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/app"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/app/*"
  to = "/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/"
  to = "/.netlify/functions/ssr?path=/"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/ssr?path=/:splat"
  status = 200
  force = false

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
