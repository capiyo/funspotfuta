name: Chat unread and mentions validation

on:
  push:
    branches: [feature/chat-unread-mentions]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run test:core
      - run: npm run typecheck:core
      - run: npm run typecheck:web
      - run: npm run typecheck:mobile
      - name: Verify Android JavaScript bundle
        run: cd apps/mobile && npx expo export --platform android --output-dir /tmp/funspot-mobile-android
      - name: Verify iOS JavaScript bundle
        run: cd apps/mobile && npx expo export --platform ios --output-dir /tmp/funspot-mobile-ios
      - run: npm run lint:web
      - run: npm run build:web
