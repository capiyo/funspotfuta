name: Monorepo typecheck

on:
  pull_request:
    branches: [master]
  push:
    branches: [feat/react-web-mobile-parity]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install workspace dependencies
        run: npm install
      - name: Type-check core
        run: npx tsc --noEmit -p packages/core/tsconfig.json
      - name: Type-check web
        run: npx tsc --noEmit -p apps/web/tsconfig.json
      - name: Type-check mobile
        run: npx tsc --noEmit -p apps/mobile/tsconfig.json
