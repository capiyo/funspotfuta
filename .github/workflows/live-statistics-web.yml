name: Live statistics web typecheck

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Resolve workspace lockfile from current manifests
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - run: npm ci --no-audit --no-fund
      - name: Typecheck shared core
        run: npm run typecheck --workspace=@funspot/core
      - name: Typecheck React web app
        run: npm run typecheck --workspace=funspot-web
