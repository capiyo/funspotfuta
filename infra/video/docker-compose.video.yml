services:
  srs:
    image: ossrs/srs:v6.0-r3
    container_name: funspot-srs
    restart: unless-stopped
    command: ["./objs/srs", "-c", "conf/srs.conf"]
    environment:
      CANDIDATE: ${SRS_PUBLIC_CANDIDATE:-*}
    ports:
      - "${SRS_RTMP_BIND:-127.0.0.1}:1935:1935/tcp"
      - "${SRS_HTTP_BIND:-127.0.0.1}:8080:8080/tcp"
      - "${SRS_RTC_BIND:-0.0.0.0}:8000:8000/udp"
    expose:
      - "1985"
    volumes:
      - ./srs.conf:/usr/local/srs/conf/srs.conf:ro
      - srs-hls:/usr/local/srs/objs/nginx/html
    networks:
      - funspot-video
    security_opt:
      - no-new-privileges:true

  video-edge:
    image: nginx:1.27-alpine
    container_name: funspot-video-edge
    restart: unless-stopped
    depends_on:
      - srs
    ports:
      - "${VIDEO_EDGE_BIND:-127.0.0.1}:8088:8080/tcp"
    volumes:
      - ./nginx-playback.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - funspot-video
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=16m
      - /var/run:size=1m

networks:
  funspot-video:
    name: funspot-video
    driver: bridge

volumes:
  srs-hls: