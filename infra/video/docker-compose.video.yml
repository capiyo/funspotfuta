services:
  srs:
    image: ossrs/srs:v6.0-r3
    container_name: funspot-srs
    restart: unless-stopped
    command: ["./objs/srs", "-c", "conf/srs.conf"]
    ports:
      - "${SRS_RTMP_BIND:-127.0.0.1}:1935:1935/tcp"
      - "${SRS_HTTP_BIND:-127.0.0.1}:8080:8080/tcp"
      - "${SRS_RTC_BIND:-0.0.0.0}:8000:8000/udp"
    expose:
      - "1985"
    volumes:
      - ./srs.conf:/usr/local/srs/conf/srs.conf:ro
      - srs-hls:/usr/local/srs/objs/nginx/html
    networks:
      - funspot-video
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:1985/api/v1/versions || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true

networks:
  funspot-video:
    name: funspot-video
    driver: bridge

volumes:
  srs-hls: