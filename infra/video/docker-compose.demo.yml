services:
  test-publisher:
    image: jrottenberg/ffmpeg:6.1-alpine
    profiles: ["demo"]
    restart: unless-stopped
    depends_on:
      - srs
    command:
      - -re
      - -f
      - lavfi
      - -i
      - testsrc2=size=1280x720:rate=30
      - -f
      - lavfi
      - -i
      - sine=frequency=1000:sample_rate=48000
      - -map
      - "0:v:0"
      - -map
      - "1:a:0"
      - -c:v
      - libx264
      - -preset
      - veryfast
      - -tune
      - zerolatency
      - -pix_fmt
      - yuv420p
      - -g
      - "30"
      - -keyint_min
      - "30"
      - -sc_threshold
      - "0"
      - -c:a
      - aac
      - -b:a
      - 128k
      - -ar
      - "48000"
      - -f
      - flv
      - rtmp://srs:1935/live/funspot-demo
    networks:
      - funspot-video
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 32

networks:
  funspot-video:
    external: true
    name: funspot-video
