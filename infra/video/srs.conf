# SRS 6 - Funspot video plane.
# Keep the HTTP API private to the Docker network.
# Replace the candidate placeholder with the public/reachable media IP or DNS.
listen              1935;
max_connections     1000;
daemon              off;
srs_log_tank        console;

http_api {
    enabled         on;
    listen          1985;
}

http_server {
    enabled         on;
    listen          8080;
    dir             ./objs/nginx/html;
}

rtc_server {
    enabled         on;
    listen          8000;
    # Development placeholder. Production must use externally reachable media IP/DNS.
    candidate       *;
}

vhost __defaultVhost__ {
    tcp_nodelay     on;
    min_latency     on;

    rtc {
        enabled         on;
        rtmp_to_rtc     on;
        rtc_to_rtmp     off;
    }

    hls {
        enabled         on;
        hls_fragment    3;
        hls_window      30;
        hls_path        ./objs/nginx/html;
        hls_m3u8_file   [app]/[stream].m3u8;
        hls_ts_file     [app]/[stream]-[seq].ts;
    }
}