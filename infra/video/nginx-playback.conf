# Nginx media edge. TLS should terminate at the public load balancer/CDN,
# which forwards HTTPS requests to this private container listener.
map $http_authorization $funspot_video_authorization {
    default $http_authorization;
    ""      "Bearer $arg_token";
}

server {
    listen 8080;
    server_name _;

    # SRS WebRTC signaling: expose only the play endpoint, never the SRS admin API.
    location = /rtc/v1/play/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "https://funspot.co.ke" always;
            add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
            add_header Access-Control-Max-Age 600 always;
            return 204;
        }

        auth_request /__funspot_video_auth;
        proxy_pass http://srs:1985/rtc/v1/play/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_buffering off;
        add_header Access-Control-Allow-Origin "https://funspot.co.ke" always;
        add_header Vary Origin always;
        add_header Cache-Control "no-store" always;
    }

    # HLS playlist and segment requests carry the short-lived grant in the URL.
    # Segment query parameters are propagated into the playlist body below.
    location ^~ /live/ {
        auth_request /__funspot_video_auth;
        proxy_pass http://srs:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 30s;
        sub_filter_types application/vnd.apple.mpegurl;
        sub_filter_once off;
        sub_filter ".ts" ".ts?token=$arg_token&stream=$arg_stream";
        add_header Access-Control-Allow-Origin "https://funspot.co.ke" always;
        add_header Vary Origin always;
        add_header Cache-Control "no-store" always;
    }

    location = /__funspot_video_auth {
        internal;
        proxy_pass https://clash-api-m5mr.onrender.com/api/video/authorize?stream=$arg_stream;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host clash-api-m5mr.onrender.com;
        proxy_set_header Authorization $funspot_video_authorization;
        proxy_ssl_server_name on;
        proxy_ssl_name clash-api-m5mr.onrender.com;
        proxy_connect_timeout 5s;
        proxy_read_timeout 5s;
    }

    location / {
        return 404;
    }
}
